          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Super Recorder A15"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RecorderService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/superrecorder/a15/RecordingConfig.kt
          package com.superrecorder.a15

          import android.content.Context
          import android.content.SharedPreferences

          data class RecordingSettings(
              val lang: String,
              val mode: Int,
              val resolutionIndex: Int,
              val bitrateMbps: Int,
              val fps: Int,
              val useHevc: Boolean,
              val enableMic: Boolean,
              val showFloating: Boolean,
              val enableBrush: Boolean,
              val enableFacecam: Boolean,
              val showWatermark: Boolean,
              val keepScreenAwake: Boolean,
              val shakeToStop: Boolean,
              val stopOnScreenOff: Boolean,
              val countdownSec: Int,
              val regionLeft: Int,
              val regionTop: Int,
              val regionWidth: Int,
              val regionHeight: Int
          )

          object PrefsManager {
              private const val PREFS_NAME = "super_recorder_a15_v2_prefs"

              private fun prefs(context: Context): SharedPreferences =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun saveSettings(context: Context, s: RecordingSettings) {
                  prefs(context).edit().apply {
                      putString("lang", s.lang)
                      putInt("mode", s.mode)
                      putInt("res", s.resolutionIndex)
                      putInt("bitrate", s.bitrateMbps)
                      putInt("fps", s.fps)
                      putBoolean("hevc", s.useHevc)
                      putBoolean("mic", s.enableMic)
                      putBoolean("floating", s.showFloating)
                      putBoolean("brush", s.enableBrush)
                      putBoolean("facecam", s.enableFacecam)
                      putBoolean("watermark", s.showWatermark)
                      putBoolean("keep_awake", s.keepScreenAwake)
                      putBoolean("shake", s.shakeToStop)
                      putBoolean("screen_off", s.stopOnScreenOff)
                      putInt("countdown", s.countdownSec)
                      putInt("r_left", s.regionLeft)
                      putInt("r_top", s.regionTop)
                      putInt("r_width", s.regionWidth)
                      putInt("r_height", s.regionHeight)
                      apply()
                  }
              }

              fun loadSettings(context: Context): RecordingSettings {
                  val p = prefs(context)
                  return RecordingSettings(
                      lang = p.getString("lang", "ar") ?: "ar",
                      mode = p.getInt("mode", 0),
                      resolutionIndex = p.getInt("res", 0),
                      bitrateMbps = p.getInt("bitrate", 12),
                      fps = p.getInt("fps", 60),
                      useHevc = p.getBoolean("hevc", false),
                      enableMic = p.getBoolean("mic", true),
                      showFloating = p.getBoolean("floating", true),
                      enableBrush = p.getBoolean("brush", true),
                      enableFacecam = p.getBoolean("facecam", false),
                      showWatermark = p.getBoolean("watermark", false),
                      keepScreenAwake = p.getBoolean("keep_awake", true),
                      shakeToStop = p.getBoolean("shake", true),
                      stopOnScreenOff = p.getBoolean("screen_off", true),
                      countdownSec = p.getInt("countdown", 3),
                      regionLeft = p.getInt("r_left", 140),
                      regionTop = p.getInt("r_top", 400),
                      regionWidth = p.getInt("r_width", 800),
                      regionHeight = p.getInt("r_height", 1000)
                  )
              }

              fun align16(value: Int): Int {
                  val aligned = (value / 16) * 16
                  return if (aligned < 160) 160 else aligned
              }
          }

