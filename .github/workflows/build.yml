                      "t_awake" -> if (isAr) "منع انطفاء الشاشة أثناء التصوير (Keep Awake)" else "Keep Screen Awake During Recording"
                      "d_awake" -> if (isAr) "منع قفل أو خفوت إضاءة الشاشة أثناء التسجيل الطويل" else "Prevent screen dimming while recording"
