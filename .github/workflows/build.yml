              private fun showFacecamOverlay() {
                  if (facecamOverlayView != null) return
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) return

                  val container = FrameLayout(this).apply {
                      background = GradientDrawable().apply {
                          setColor(Color.BLACK)
                          cornerRadius = dp(18).toFloat()
                          setStroke(dp(2), Color.parseColor("#38BDF8"))
                      }
                      setPadding(dp(2), dp(2), dp(2), dp(2))
                  }

                  val textureView = TextureView(this)
                  container.addView(textureView, FrameLayout.LayoutParams(dp(115), dp(150)))

                  textureView.surfaceTextureListener = object : TextureView.SurfaceTextureListener {
                      override fun onSurfaceTextureAvailable(surface: SurfaceTexture, width: Int, height: Int) {
                          openFrontCamera(surface)
                      }
                      override fun onSurfaceTextureSizeChanged(surface: SurfaceTexture, width: Int, height: Int) {}
                      override fun onSurfaceTextureDestroyed(surface: SurfaceTexture): Boolean {
                          closeFrontCamera()
                          return true
                      }
                      override fun onSurfaceTextureUpdated(surface: SurfaceTexture) {}
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dp(18)
                      y = dp(120)
                  }

                  makeDraggable(container, params)
                  facecamOverlayView = container
                  windowManager.addView(container, params)
              }

              private fun openFrontCamera(surfaceTexture: SurfaceTexture) {
                  try {
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) return
                      val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val frontId = cm.cameraIdList.firstOrNull { id ->
                          cm.getCameraCharacteristics(id).get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT
                      } ?: cm.cameraIdList.firstOrNull() ?: return

                      surfaceTexture.setDefaultBufferSize(640, 480)
                      val previewSurface = Surface(surfaceTexture)

                      cm.openCamera(frontId, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              cameraDevice = camera
                              try {
                                  val reqBuilder = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW).apply {
                                      addTarget(previewSurface)
                                  }
                                  @Suppress("DEPRECATION")
                                  camera.createCaptureSession(
                                      listOf(previewSurface),
                                      object : CameraCaptureSession.StateCallback() {
                                          override fun onConfigured(session: CameraCaptureSession) {
                                              cameraCaptureSession = session
                                              try {
                                                  session.setRepeatingRequest(reqBuilder.build(), null, mainHandler)
                                              } catch (_: Exception) {}
                                          }
                                          override fun onConfigureFailed(session: CameraCaptureSession) {}
                                      },
                                      mainHandler
                                  )
                              } catch (_: Exception) {}
                          }
                          override fun onDisconnected(camera: CameraDevice) { closeFrontCamera() }
                          override fun onError(camera: CameraDevice, error: Int) { closeFrontCamera() }
                      }, mainHandler)
                  } catch (_: Exception) {}
              }

              private fun closeFrontCamera() {
                  try { cameraCaptureSession?.close() } catch (_: Exception) {}
                  cameraCaptureSession = null
                  try { cameraDevice?.close() } catch (_: Exception) {}
                  cameraDevice = null
              }

              private fun makeDraggable(targetView: View, params: WindowManager.LayoutParams) {
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f

                  targetView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - touchX).toInt()
                              val dy = (event.rawY - touchY).toInt()
                              params.x = startX - dx
                              params.y = startY + dy
                              windowManager.updateViewLayout(targetView, params)
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun showRegionFramingMask() {
                  val maskView = object : View(this) {
                      private val maskPaint = Paint().apply { color = Color.BLACK }
                      private val clearPaint = Paint().apply {
                          color = Color.TRANSPARENT
                          xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                      }
                      private val frameBorder = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.parseColor("#FF6B00")
                          style = Paint.Style.STROKE
                          strokeWidth = dp(2).toFloat()
                      }

                      init {
                          setLayerType(LAYER_TYPE_SOFTWARE, null)
                      }

                      override fun onDraw(canvas: Canvas) {
                          super.onDraw(canvas)
                          canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), maskPaint)
                          val l = settings.regionLeft.toFloat()
                          val t = settings.regionTop.toFloat()
                          val r = (settings.regionLeft + settings.regionWidth).toFloat()
                          val b = (settings.regionTop + settings.regionHeight).toFloat()
                          canvas.drawRect(l, t, r, b, clearPaint)
                          canvas.drawRect(l, t, r, b, frameBorder)
                      }
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  regionMaskView = maskView
                  windowManager.addView(maskView, params)
              }

              private fun showFloatingController() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = GradientDrawable().apply {
                          setColor(Color.argb(230, 15, 23, 42))
                          cornerRadius = dp(28).toFloat()
                          setStroke(dp(2), Color.parseColor("#FF6B00"))
                      }
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                  }

                  val tvTimer = TextView(this).apply {
                      text = "00:00"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      paint.isFakeBoldText = true
                      setPadding(dp(6), dp(4), dp(8), dp(4))
                  }
                  tvFloatingTimer = tvTimer

                  val toolsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      visibility = View.GONE
                  }

                  val btnPause = createFloatingChip("❚❚", "#0284C7") { togglePauseResume() }
                  btnFloatingPause = btnPause
                  toolsRow.addView(btnPause)

                  if (settings.enableBrush) {
                      val btnBrush = createFloatingChip("✎", "#8B5CF6") { toggleBrushOverlay() }
                      toolsRow.addView(btnBrush)
                  }

                  val btnCam = createFloatingChip("📷", "#10B981") {
                      if (facecamOverlayView == null) {
                          showFacecamOverlay()
                      } else {
                          closeFrontCamera()
                          removeSafe(facecamOverlayView)
                          facecamOverlayView = null
                      }
                  }
                  toolsRow.addView(btnCam)

                  val btnHide = createFloatingChip("👁", "#475569") {
                      removeSafe(floatingRootView)
                      floatingRootView = null
                      Toast.makeText(this, tr("hide_float_toast"), Toast.LENGTH_SHORT).show()
                  }
                  toolsRow.addView(btnHide)

                  val btnStop = createFloatingChip("■", "#EF4444") { stopRecordingAndCleanup() }
                  toolsRow.addView(btnStop)

                  root.addView(tvTimer)
                  root.addView(toolsRow)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 300
                  }

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var isMoved = false

                  tvTimer.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              isMoved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - touchX).toInt()
                              val dy = (event.rawY - touchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) {
                                  isMoved = true
                                  params.x = startX + dx
                                  params.y = startY + dy
                                  windowManager.updateViewLayout(root, params)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isMoved) {
                                  toolsRow.visibility = if (toolsRow.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  floatingRootView = root
                  windowManager.addView(root, params)
              }

              private fun createFloatingChip(symbol: String, colorHex: String, onClick: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = symbol
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(colorHex))
                          cornerRadius = dp(16).toFloat()
                      }
                      val lp = LinearLayout.LayoutParams(dp(32), dp(32)).apply {
                          marginStart = dp(6)
                      }
                      layoutParams = lp
                      setOnClickListener { onClick() }
                  }
              }

              private fun toggleBrushOverlay() {
                  if (brushOverlayView != null) {
                      removeSafe(brushOverlayView)
                      brushOverlayView = null
                      return
                  }

                  val paths = mutableListOf<Pair<Path, Int>>()
                  var currentPath = Path()
                  var currentColor = Color.parseColor("#FF3B30")

                  val drawingCanvasView = object : View(this) {
                      private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          style = Paint.Style.STROKE
                          strokeJoin = Paint.Join.ROUND
                          strokeCap = Paint.Cap.ROUND
                          strokeWidth = dp(5).toFloat()
                      }

                      override fun onDraw(canvas: Canvas) {
                          super.onDraw(canvas)
                          for ((p, col) in paths) {
                              paint.color = col
                              canvas.drawPath(p, paint)
                          }
                          paint.color = currentColor
                          canvas.drawPath(currentPath, paint)
                      }

                      override fun onTouchEvent(event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  currentPath = Path().apply { moveTo(event.x, event.y) }
                                  invalidate()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  currentPath.lineTo(event.x, event.y)
                                  invalidate()
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  paths.add(Pair(currentPath, currentColor))
                                  currentPath = Path()
                                  invalidate()
                                  return true
                              }
                          }
                          return false
                      }
                  }

                  val rootFrame = FrameLayout(this)
                  rootFrame.addView(drawingCanvasView, FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply {
                          setColor(Color.argb(235, 15, 23, 42))
                          cornerRadius = dp(20).toFloat()
                          setStroke(dp(1), Color.parseColor("#334155"))
                      }
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }

                  val colors = listOf("#FF3B30", "#FFCC00", "#34C759", "#38BDF8", "#FFFFFF")
                  colors.forEach { hex ->
                      val colorDot = View(this).apply {
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor(hex))
                              cornerRadius = dp(14).toFloat()
                          }
                          layoutParams = LinearLayout.LayoutParams(dp(28), dp(28)).apply { marginEnd = dp(8) }
                          setOnClickListener { currentColor = Color.parseColor(hex) }
                      }
                      bar.addView(colorDot)
                  }

                  val btnClear = createFloatingChip(tr("clear_brush"), "#475569") {
                      paths.clear()
                      currentPath.reset()
                      drawingCanvasView.invalidate()
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(dp(56), dp(28)).apply { marginEnd = dp(6) }
                  }
                  val btnClose = createFloatingChip("✕", "#EF4444") {
                      removeSafe(brushOverlayView)
                      brushOverlayView = null
                  }.apply {
                      layoutParams = LinearLayout.LayoutParams(dp(32), dp(28))
                  }

                  bar.addView(btnClear)
                  bar.addView(btnClose)

                  val barLp = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      bottomMargin = dp(40)
                  }
                  rootFrame.addView(bar, barLp)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  brushOverlayView = rootFrame
                  windowManager.addView(rootFrame, params)
              }

              private fun togglePauseResume() {
                  if (!isRecording || Build.VERSION.SDK_INT < Build.VERSION_CODES.N) return
                  try {
                      if (!isPaused) {
                          mediaRecorder?.pause()
                          isPaused = true
                          btnFloatingPause?.text = "▶"
                          startForegroundWithProjectionType(tr("pause_notif"))
                      } else {
                          mediaRecorder?.resume()
                          isPaused = false
                          btnFloatingPause?.text = "❚❚"
                          startForegroundWithProjectionType(tr("rec_notif"))
                      }
                  } catch (_: Exception) {}
              }

              private fun stopRecordingAndCleanup() {
                  mainHandler.removeCallbacks(timerRunnable)

                  closeFrontCamera()
                  removeSafe(floatingRootView); floatingRootView = null
                  removeSafe(brushOverlayView); brushOverlayView = null
                  removeSafe(regionMaskView); regionMaskView = null
                  removeSafe(countdownOverlayView); countdownOverlayView = null
                  removeSafe(watermarkOverlayView); watermarkOverlayView = null
                  removeSafe(facecamOverlayView); facecamOverlayView = null

                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                  } catch (_: Exception) {}
                  wakeLock = null

                  sensorManager?.unregisterListener(this)
                  screenOffReceiver?.let {
                      try { unregisterReceiver(it) } catch (_: Exception) {}
                      screenOffReceiver = null
                  }

                  if (isRecording) {
                      isRecording = false
                      try {
                          mediaRecorder?.stop()
                      } catch (_: Exception) {}
                      try {
                          mediaRecorder?.reset()
                          mediaRecorder?.release()
                      } catch (_: Exception) {}
                      mediaRecorder = null

                      virtualDisplay?.release()
                      virtualDisplay = null

                      mediaProjection?.stop()
                      mediaProjection = null

                      publishVideoToGallery(outputFilePath)
                  }

                  @Suppress("DEPRECATION")
                  stopForeground(true)
                  stopSelf()
              }

              private fun createOutputFile(): String {
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val dir = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), "SuperRecorder_A15")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "A15_Pro_$stamp.mp4").absolutePath
              }

              private fun publishVideoToGallery(sourcePath: String) {
                  val srcFile = File(sourcePath)
                  if (!srcFile.exists() || srcFile.length() == 0L) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, srcFile.name)
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/SuperRecorder_A15")
                          put(MediaStore.Video.Media.IS_PENDING, 1)
                      }
                      val resolver = contentResolver
                      val collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      val itemUri = resolver.insert(collection, values)
                      if (itemUri != null) {
                          resolver.openOutputStream(itemUri)?.use { outStream ->
                              srcFile.inputStream().use { inStream -> inStream.copyTo(outStream) }
                          }
                          values.clear()
                          values.put(MediaStore.Video.Media.IS_PENDING, 0)
                          resolver.update(itemUri, values, null, null)
                          srcFile.delete()
                      }
                  } else {
                      MediaScannerConnection.scanFile(this, arrayOf(sourcePath), arrayOf("video/mp4"), null)
                  }

                  Toast.makeText(this, tr("saved_toast"), Toast.LENGTH_LONG).show()
              }

              private fun registerShakeSensor() {
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val accel = sensorManager?.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  sensorManager?.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_ACCELEROMETER && isRecording) {
                      val x = event.values[0]
                      val y = event.values[1]
                      val z = event.values[2]
                      val gForce = sqrt((x * x + y * y + z * z).toDouble()) / SensorManager.GRAVITY_EARTH
                      if (gForce > 2.7) {
                          val now = System.currentTimeMillis()
                          if (now - lastShakeTime > 1500) {
                              lastShakeTime = now
                              stopRecordingAndCleanup()
                          }
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun registerScreenOffReceiver() {
                  screenOffReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          if (intent?.action == Intent.ACTION_SCREEN_OFF && isRecording) {
                              stopRecordingAndCleanup()
                          }
                      }
                  }
                  registerReceiver(screenOffReceiver, IntentFilter(Intent.ACTION_SCREEN_OFF))
              }

              private fun buildNotification(statusText: String): Notification {
                  val stopIntent = Intent(this, RecorderService::class.java).apply { action = ACTION_STOP }
                  val stopPending = PendingIntent.getService(
                      this, 1, stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val pauseIntent = Intent(this, RecorderService::class.java).apply { action = ACTION_PAUSE_RESUME }
                  val pausePending = PendingIntent.getService(
                      this, 2, pauseIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

                  return builder
                      .setContentTitle("Super Recorder A15 Ultra")
                      .setContentText(statusText)
                      .setSmallIcon(android.R.drawable.presence_video_online)
                      .setOngoing(true)
                      .addAction(
                          Notification.Action.Builder(
                              android.R.drawable.ic_media_pause,
                              if (isPaused) tr("act_resume") else tr("act_pause"),
                              pausePending
                          ).build()
                      )
                      .addAction(
                          Notification.Action.Builder(
                              android.R.drawable.ic_delete,
                              tr("act_stop"),
                              stopPending
                          ).build()
                      )
                      .build()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Super Recorder Studio Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun overlayType(): Int =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

              private fun removeSafe(v: View?) {
                  if (v != null) {
                      try { windowManager.removeView(v) } catch (_: Exception) {}
                  }
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()

              override fun onBind(intent: Intent?): IBinder? = null
          }
