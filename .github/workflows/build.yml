              private var cameraCaptureSession: CameraCaptureSession? = null

              private var sensorManager: SensorManager? = null
              private var lastShakeTime = 0L
              private var screenOffReceiver: BroadcastReceiver? = null

              private fun tr(key: String): String = AppStrings.get(settings.lang, key)

              private val timerRunnable = object : Runnable {
                  override fun run() {
                      if (isRecording && !isPaused) {
                          elapsedSeconds++
                          val mins = elapsedSeconds / 60
                          val secs = elapsedSeconds % 60
                          tvFloatingTimer?.text = String.format(Locale.US, "%02d:%02d", mins, secs)
                      }
                      if (isRecording) {
                          mainHandler.postDelayed(this, 1000)
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          if (!isRecording) {
                              settings = PrefsManager.loadSettings(this)
                              val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                              val resultData: Intent? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  intent.getParcelableExtra(EXTRA_RESULT_DATA, Intent::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  intent.getParcelableExtra(EXTRA_RESULT_DATA)
                              }

                              if (resultData != null) {
                                  startForegroundWithProjectionType(tr("prep_notif"))
                                  runCountdownThenStart(resultCode, resultData)
                              }
                          }
                      }
                      ACTION_PAUSE_RESUME -> togglePauseResume()
                      ACTION_STOP -> stopRecordingAndCleanup()
                  }
                  return START_NOT_STICKY
              }

              private fun startForegroundWithProjectionType(statusText: String) {
                  val notif = buildNotification(statusText)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              private fun runCountdownThenStart(resultCode: Int, resultData: Intent) {
                  val cd = settings.countdownSec
                  if (cd <= 0 || !Settings.canDrawOverlays(this)) {
                      beginScreenCapture(resultCode, resultData)
                      return
                  }

                  val tvCount = TextView(this).apply {
                      text = cd.toString()
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 64f)
                      paint.isFakeBoldText = true
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          setColor(Color.argb(220, 255, 107, 0))
                          cornerRadius = dp(65).toFloat()
                          setStroke(dp(3), Color.WHITE)
                      }
                  }

                  val frame = FrameLayout(this).apply {
                      addView(tvCount, FrameLayout.LayoutParams(dp(130), dp(130), Gravity.CENTER))
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.CENTER }

                  countdownOverlayView = frame
                  windowManager.addView(frame, params)

                  var remaining = cd
                  val cdRunnable = object : Runnable {
                      override fun run() {
                          remaining--
                          if (remaining > 0) {
                              tvCount.text = remaining.toString()
                              mainHandler.postDelayed(this, 1000)
                          } else {
                              removeSafe(countdownOverlayView)
                              countdownOverlayView = null
                              beginScreenCapture(resultCode, resultData)
                          }
                      }
                  }
                  mainHandler.postDelayed(cdRunnable, 1000)
              }

              private fun beginScreenCapture(resultCode: Int, resultData: Intent) {
                  try {
                      val (videoW, videoH) = calculateTargetDimensions()
                      outputFilePath = createOutputFile()

                      mediaRecorder = try {
                          buildConfiguredRecorder(videoW, videoH, settings.useHevc)
                      } catch (_: Exception) {
                          buildConfiguredRecorder(videoW, videoH, false)
                      }

                      mediaProjection = projectionManager.getMediaProjection(resultCode, resultData)?.apply {
                          registerCallback(object : MediaProjection.Callback() {
                              override fun onStop() {
                                  if (isRecording) stopRecordingAndCleanup()
                              }
                          }, mainHandler)
                      }

                      val dm = resources.displayMetrics
                      virtualDisplay = mediaProjection?.createVirtualDisplay(
                          "SuperRecorderA15DisplayV2",
                          videoW,
                          videoH,
                          dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          mediaRecorder?.surface,
                          null,
                          null
                      )

                      mediaRecorder?.start()
                      isRecording = true
                      isPaused = false
                      elapsedSeconds = 0

                      if (settings.keepScreenAwake) acquireWakeLock()

                      if (settings.mode == 2 && Settings.canDrawOverlays(this)) {
                          showRegionFramingMask()
                      }
                      if (settings.showWatermark && Settings.canDrawOverlays(this)) {
                          showLiveWatermarkOverlay()
                      }
                      if (settings.enableFacecam && Settings.canDrawOverlays(this)) {
                          showFacecamOverlay()
                      }
                      if (settings.showFloating && Settings.canDrawOverlays(this)) {
                          showFloatingController()
                      }

                      if (settings.shakeToStop) registerShakeSensor()
                      if (settings.stopOnScreenOff) registerScreenOffReceiver()

                      startForegroundWithProjectionType(tr("rec_notif"))
                      mainHandler.post(timerRunnable)

                  } catch (e: Exception) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      stopRecordingAndCleanup()
                  }
              }

              private fun buildConfiguredRecorder(videoW: Int, videoH: Int, useHevc: Boolean): MediaRecorder {
                  return (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      MediaRecorder(this)
                  } else {
                      @Suppress("DEPRECATION")
                      MediaRecorder()
                  }).apply {
                      if (settings.enableMic) {
                          setAudioSource(MediaRecorder.AudioSource.MIC)
                      }
                      setVideoSource(MediaRecorder.VideoSource.SURFACE)
                      setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      setOutputFile(outputFilePath)
                      setVideoEncoder(
                          if (useHevc) MediaRecorder.VideoEncoder.HEVC
                          else MediaRecorder.VideoEncoder.H264
                      )
                      if (settings.enableMic) {
                          setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          setAudioEncodingBitRate(128000)
                          setAudioSamplingRate(44100)
                      }
                      setVideoSize(videoW, videoH)
                      setVideoFrameRate(settings.fps)
                      setVideoEncodingBitRate(settings.bitrateMbps * 1_000_000)
                      prepare()
                  }
              }

              private fun acquireWakeLock() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      @Suppress("DEPRECATION")
                      wakeLock = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ON_AFTER_RELEASE, "SuperRecorder:AwakeLock")
                      wakeLock?.acquire(3 * 60 * 60 * 1000L)
                  } catch (_: Exception) {}
              }

              private fun calculateTargetDimensions(): Pair<Int, Int> {
                  val baseShort = when (settings.resolutionIndex) {
                      0 -> 1072
                      1 -> 720
                      else -> 480
                  }
                  val baseLong = when (settings.resolutionIndex) {
                      0 -> 2336
                      1 -> 1552
                      else -> 1040
                  }

                  return when (settings.mode) {
                      0 -> Pair(baseShort, baseLong)
                      1 -> Pair(baseLong, baseShort)
                      else -> Pair(baseShort, baseLong)
                  }
              }

