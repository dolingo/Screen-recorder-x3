name: Build SuperRecorder A15 Pro v2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/superrecorder/a15
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SuperRecorderA15"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.superrecorder.a15'
              compileSdk 34

              defaultConfig {
                  applicationId "com.superrecorder.a15"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-A15Ultra"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          # 1. Professional Adaptive App Icon Background
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#0B0F19" />
                          <item android:offset="0.5" android:color="#161F33" />
                          <item android:offset="1.0" android:color="#26120B" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:fillColor="#14FF6B00"
                  android:pathData="M54,54m-42,0a42,42 0,1 1,84 0a42,42 0,1 1,-84 0" />
          </vector>
          EOF

          # 2. Professional Adaptive App Icon Foreground (Camera Lens + Neon REC Ring)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Glowing Ring -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FF6B00"
                  android:strokeWidth="3.5"
                  android:pathData="M54,54m-27,0a27,27 0,1 1,54 0a27,27 0,1 1,-54 0" />
              <!-- Inner Dark Lens Body -->
              <path
                  android:fillColor="#1C2433"
                  android:pathData="M54,54m-22,0a22,22 0,1 1,44 0a22,22 0,1 1,-44 0" />
              <!-- Center Ruby Recording Core -->
              <path
                  android:fillColor="#FF2E4C"
                  android:pathData="M54,54m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0" />
              <!-- Lens Glint Reflection -->
              <path
                  android:fillColor="#66FFFFFF"
                  android:pathData="M47,45m-3.5,0a3.5,3.5 0,1 1,7 0a3.5,3.5 0,1 1,-7 0" />
              <!-- Top Right Live Indicator Dot -->
              <path
                  android:fillColor="#00E676"
                  android:pathData="M74,34m-4,0a4,4 0,1 1,8 0a4,4 0,1 1,-8 0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
