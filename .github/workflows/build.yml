          cat << 'EOF' > app/src/main/java/com/superrecorder/a15/MainActivity.kt
          package com.superrecorder.a15

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import kotlin.math.hypot

          class MainActivity : Activity() {

              private lateinit var projectionManager: MediaProjectionManager
              private lateinit var settings: RecordingSettings

              private var currentLang = "ar"
              private var selectedMode = 0
              private var selectedRes = 0
              private var selectedBitrate = 12
              private var selectedFps = 60
              private var selectedHevc = false
              private var selectedCountdown = 3

              private lateinit var swMic: Switch
              private lateinit var swFacecam: Switch
              private lateinit var swBrush: Switch
              private lateinit var swFloating: Switch
              private lateinit var swWatermark: Switch
              private lateinit var swAwake: Switch
              private lateinit var swShake: Switch
              private lateinit var swScreenOff: Switch
              private lateinit var tvRegionInfo: TextView
              private lateinit var btnSelectRegion: Button

              private var regionOverlayView: View? = null

              companion object {
                  private const val REQ_MEDIA_PROJECTION = 1001
                  private const val REQ_PERMISSIONS = 1002
                  private const val REQ_OVERLAY = 1003
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  loadStateFromPrefs()

                  window.statusBarColor = Color.parseColor("#090D16")
                  window.navigationBarColor = Color.parseColor("#090D16")

                  rebuildScreen()
              }

              private fun loadStateFromPrefs() {
                  settings = PrefsManager.loadSettings(this)
                  currentLang = settings.lang
                  selectedMode = settings.mode
                  selectedRes = settings.resolutionIndex
                  selectedBitrate = settings.bitrateMbps
                  selectedFps = settings.fps
                  selectedHevc = settings.useHevc
                  selectedCountdown = settings.countdownSec
              }

              private fun tr(key: String): String = AppStrings.get(currentLang, key)

              private fun rebuildScreen() {
                  window.decorView.layoutDirection =
                      if (currentLang == "ar") View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
                  setContentView(buildDashboardUI())
              }

              private fun buildDashboardUI(): View {
                  val rootScroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#090D16"))
                      isFillViewport = true
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(32))
                  }

                  // Top Modern App Header Card
                  val headerCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#161F33"), Color.parseColor("#0F1523"))
                      ).apply {
                          cornerRadius = dp(20).toFloat()
                          setStroke(dp(1), Color.parseColor("#FF6B00"))
                      }
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }

                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val appLogo = ImageView(this).apply {
                      setImageResource(R.drawable.ic_launcher_foreground)
                      background = roundedBg("#1E293B", "#FF6B00", 14, 1)
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                      layoutParams = LinearLayout.LayoutParams(dp(48), dp(48))
                  }

                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginStart = dp(12)
                          marginEnd = dp(8)
                      }
                  }

                  val tvTitle = TextView(this).apply {
                      text = tr("app_title")
                      setTextColor(Color.parseColor("#FF7B00"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                      paint.isFakeBoldText = true
                  }

                  val tvSub = TextView(this).apply {
                      text = tr("app_subtitle")
                      setTextColor(Color.parseColor("#94A3B8"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                  }

                  titleCol.addView(tvTitle)
                  titleCol.addView(tvSub)

                  val btnLang = TextView(this).apply {
                      text = tr("lang_btn")
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      paint.isFakeBoldText = true
                      background = roundedBg("#1E293B", "#38BDF8", 10, 1)
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      setOnClickListener {
                          currentLang = if (currentLang == "ar") "en" else "ar"
                          saveCurrentStateToPrefs()
                          rebuildScreen()
                      }
                  }

                  topRow.addView(appLogo)
                  topRow.addView(titleCol)
                  topRow.addView(btnLang)
                  headerCard.addView(topRow)

                  // Quick Action Bar inside Header (Gallery Access)
                  val galleryBtn = TextView(this).apply {
                      text = tr("videos_btn")
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#E2E8F0"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      paint.isFakeBoldText = true
                      background = roundedBg("#1E293B", "#334155", 10, 1)
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                      val lp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(12) }
